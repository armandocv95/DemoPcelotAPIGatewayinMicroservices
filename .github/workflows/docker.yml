name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-authentication:
    name: Build & Push - AuthenticationApi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: apigatwaycicd.azurecr.io
          username: ${{ secrets.APIGatwayCICD }}
          password: ${{ secrets.GEInDtE4XHYjR5lDVd6DEurepMYGHB5OZA+wcJFtCs+ACRDYeDvb }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./AuthenticationApi
          file: ./AuthenticationApi/Dockerfile
          push: true
          tags: apigatwaycicd.azurecr.io/authenticationapi:latest

  build-gateway:
